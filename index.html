<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Em Manutenção | Estamos Voltando Mais Fortes</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0a0e17;
      --primary: #00d4ff;
      --primary-dark: #0099cc;
      --text: #e0f7ff;
      --text-muted: #a3cdda;
      --accent: #ff2e63;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(0, 212, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(255, 46, 99, 0.06) 0%, transparent 40%);
    }

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: transparent;
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(3.5rem, 12vw, 9rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      background: linear-gradient(90deg, var(--primary), #7c4dff, var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 60px rgba(0, 212, 255, 0.4);
      margin-bottom: 0.8rem;
      animation: glow 4s ease-in-out infinite alternate;
    }

    .subtitle {
      font-size: clamp(1.25rem, 5vw, 1.8rem);
      color: var(--text-muted);
      max-width: 620px;
      line-height: 1.5;
      margin: 1.5rem 0 2.5rem;
    }

    .maintenance-text {
      font-size: 1.3rem;
      color: var(--primary);
      margin: 2rem 0;
      font-weight: 500;
      letter-spacing: 0.05em;
    }

    .btn-old-version {
      display: inline-block;
      padding: 1rem 2.5rem;
      font-size: 1.2rem;
      font-weight: 600;
      color: white;
      text-decoration: none;
      background: linear-gradient(135deg, var(--primary), #0099cc);
      border-radius: 50px;
      border: none;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 10px 30px rgba(0, 212, 255, 0.35);
      margin-top: 1.5rem;
    }

    .btn-old-version:hover {
      transform: translateY(-8px) scale(1.05);
      box-shadow: 0 20px 50px rgba(0, 212, 255, 0.5);
      background: linear-gradient(135deg, #00eaff, #00b8ff);
    }

    .progress {
      width: 280px;
      height: 6px;
      background: rgba(255,255,255,0.08);
      border-radius: 3px;
      margin: 3rem auto 1rem;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
      border-radius: 3px;
      animation: loading 3.5s infinite ease-in-out;
    }

    .footer {
      position: absolute;
      bottom: 2rem;
      opacity: 0.6;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
    }

    @keyframes glow {
      from { text-shadow: 0 0 30px rgba(0, 212, 255, 0.3); }
      to   { text-shadow: 0 0 80px rgba(0, 212, 255, 0.7), 0 0 120px rgba(124, 77, 255, 0.4); }
    }

    @keyframes loading {
      0%   { transform: translateX(-100%); }
      50%  { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }

    @media (max-width: 480px) {
      h1 { font-size: 5.5rem; }
      .subtitle { font-size: 1.2rem; }
    }
  </style>
</head>
<body>

  <div class="stars"></div>

  <div class="container">
    <h1>EM MANUTENÇÃO</h1>
    
    <p class="subtitle">
      Estamos tunando o sistema para entregar uma experiência ainda mais incrível.<br>
      Volte em breve — vai valer a pena!
    </p>

    <div class="maintenance-text">
      Previsão de retorno: <strong>em breve</strong> ✨
    </div>

    <div class="progress">
      <div class="progress-bar"></div>
    </div>

    <a href="Versaoantiga.html" class="btn-old-version">
      → Acessar a versão antiga
    </a>

    <div class="footer">
      Estamos trabalhando com carinho para trazer algo especial
    </div>
  </div>

  <script>
    // Estrelas animadas de fundo (opcional - pode remover se quiser mais leve)
    function createStar() {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.position = 'absolute';
      star.style.background = 'white';
      star.style.borderRadius = '50%';
      const size = Math.random() * 2.5 + 0.8;
      star.style.width = size + 'px';
      star.style.height = size + 'px';
      star.style.left = Math.random() * 100 + 'vw';
      star.style.top = Math.random() * 100 + 'vh';
      star.style.opacity = Math.random() * 0.7 + 0.3;
      star.style.animation = `twinkle ${Math.random() * 6 + 4}s infinite alternate`;
      document.querySelector('.stars').appendChild(star);
    }

    for(let i = 0; i < 120; i++) {
      createStar();
    }

    // Adiciona estilo da animação twinkles via JS
    const style = document.createElement('style');
    style.textContent = `
      @keyframes twinkle {
        0%,100% { opacity: 0.3; }
        50%     { opacity: 1; transform: scale(1.15); }
      }
    `;
    document.head.appendChild(style);
  </script>

</body>
</html>
